/* ─── STORAGE ─── */
async function uploadPhoto(file, id) {
  const ext = (file.type||'image/jpeg').split('/')[1]||'jpg';
  const path = `${id}.${ext}`;
  const { error } = await db.storage.from('labels').upload(path, file, { upsert:true, contentType:file.type });
  if (error) throw error;
  const { data } = db.storage.from('labels').getPublicUrl(path);
  return data.publicUrl;
}

/* ─── SYNC DOT ─── */
function SyncDot({state}) {
  const colors  = {online:'#4a8c6a',syncing:'#c9a84c',offline:'#8b1a1a'};
  const tips    = {online:'Synchronisé avec Supabase',syncing:'Synchronisation…',offline:'Hors ligne — données locales'};
  return (
    <div title={tips[state]||''} className="sync-dot" style={{
      background: colors[state]||'#6b5050',
      boxShadow: state==='online'?'0 0 6px rgba(74,140,106,.6)':'none',
      animation: state==='syncing'?'pulse 1s infinite':'none'
    }}/>
  );
}

/* ─── STARS ─── */
function Stars({rating, onRate, size='1.4rem'}) {
  const [h,setH] = useState(0);
  return (
    <div className="rating-inp">
      {[1,2,3,4,5].map(i=>(
        <span key={i} className={`r-star ${(h||rating)>=i?'on':''}`} style={{fontSize:size}}
          onMouseEnter={()=>onRate&&setH(i)} onMouseLeave={()=>onRate&&setH(0)}
          onClick={()=>onRate&&onRate(i)}>★</span>
      ))}
    </div>
  );
}

/* ─── TOAST ─── */
function Toast({msg,icon,onDone}) {
  useEffect(()=>{const t=setTimeout(onDone,3000);return()=>clearTimeout(t);},[]);
  return <div className="toast"><span>{icon}</span><span>{msg}</span></div>;
}

/* ─── SCAN EXIT MODAL ─── */
function ScanExitModal({wines,onSimpleOut,onSante,onCancel}) {
  const [step,setStep] = useState('photo');
  const [imgSrc,setImgSrc] = useState(null);
  const [match,setMatch] = useState(null);

  const handleFile = e => {
    const f = e.target.files?.[0]; if(!f) return;
    const r = new FileReader();
    r.onload = ev => {
      setImgSrc(ev.target.result); setStep('analyzing');
      setTimeout(()=>{
        const res = simulateOCR(wines);
        if(res){setMatch(res);setStep('result');} else setStep('notfound');
      },2200);
    };
    r.readAsDataURL(f);
  };
  const reset = () => {setStep('photo');setImgSrc(null);setMatch(null);};
  const stepN = {photo:1,analyzing:2,result:3,notfound:3};

  return (
    <div className="modal-ov" onClick={e=>e.target===e.currentTarget&&onCancel()}>
      <div className="modal">
        <div className="modal-handle"/>
        <div className="modal-title">📷 Scanner une étiquette</div>
        <div className="modal-sub">Photographiez l'étiquette pour identifier le vin</div>
        <div className="scan-steps">
          {[['1','Photo'],['2','Analyse'],['3','Résultat']].map(([n,l],i)=>(
            <React.Fragment key={n}>
              {i>0&&<div className="scan-step-line"/>}
              <div className={`scan-step ${stepN[step]>i+1?'done':stepN[step]===i+1?'active':''}`}>
                <div className="scan-step-dot">{stepN[step]>i+1?'✓':n}</div>
                <span style={{fontSize:'.67rem'}}>{l}</span>
              </div>
            </React.Fragment>
          ))}
        </div>

        {step==='photo'&&(
          <div>
            <div className="photo-zone">
              <input type="file" accept="image/*" capture="environment" onChange={handleFile}/>
              <div className="photo-zone-ico">📷</div>
              <div className="photo-zone-lbl">Appuyer pour photographier l'étiquette</div>
              <div className="photo-zone-hint">L'analyse est locale — fonctionne hors ligne</div>
            </div>
            <div style={{marginTop:14,display:'flex',gap:9}}>
              <button className="btn btn-ghost" style={{flex:1,justifyContent:'center'}} onClick={onCancel}>Annuler</button>
            </div>
          </div>
        )}

        {step==='analyzing'&&(
          <div>
            <div className="scan-preview-wrap">
              <img src={imgSrc} alt="" className="scan-preview"/>
              <div className="scan-overlay">
                <div className="scan-corners">
                  <div className="scan-corner sc-tl"/><div className="scan-corner sc-tr"/>
                  <div className="scan-corner sc-bl"/><div className="scan-corner sc-br"/>
                </div>
                <div className="scan-line"/>
              </div>
            </div>
            <div className="scan-status scan-analyzing"><span className="spin">⏳</span>Analyse OCR en cours…</div>
          </div>
        )}

        {step==='result'&&match&&(
          <div>
            <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:12}}>
              <span style={{fontSize:'.78rem',color:'#6abf8e'}}>✓ Vin identifié avec {match.confidence}% de confiance</span>
            </div>
            <div className="scan-result">
              <div className="sr-head">
                <div className="sr-thumb">{match.wine.img?<img src={match.wine.img} alt=""/>:'🍷'}</div>
                <div className="sr-info">
                  <div className="sr-name">{match.wine.name}</div>
                  <div className="sr-meta">{match.wine.appellation} · {match.wine.vintage} · {COLOR_LABEL[match.wine.color]}</div>
                </div>
                <div className="sr-qty"><div style={{fontSize:'.6rem',color:'var(--text3)',marginBottom:2}}>En cave</div>{match.wine.qty}</div>
              </div>
              <div className="sr-conf">
                <span className="conf-lbl">Confiance OCR</span>
                <div className="conf-bar"><div className="conf-fill" style={{width:`${match.confidence}%`}}/></div>
                <span className="conf-lbl">{match.confidence}%</span>
              </div>
            </div>
            <div style={{fontSize:'.72rem',color:'var(--text3)',textAlign:'center',margin:'10px 0 4px'}}>
              Pas le bon vin ? <span style={{color:'var(--gold)',cursor:'pointer',textDecoration:'underline'}} onClick={reset}>Réessayer</span>
            </div>
            <div className="sr-actions">
              <button className="btn btn-ghost" style={{flexShrink:0,padding:'10px'}} onClick={onCancel}>✕</button>
              <button className="btn btn-ghost" onClick={()=>onSimpleOut(match.wine)}>− Sortie simple</button>
              <button className="btn btn-sante" onClick={()=>onSante(match.wine)}>🌿 Santé !</button>
            </div>
          </div>
        )}

        {step==='notfound'&&(
          <div style={{textAlign:'center',padding:'24px'}}>
            <div style={{fontSize:'2.2rem',marginBottom:10,opacity:.5}}>🔍</div>
            <h4 style={{fontFamily:"'Playfair Display',serif",fontSize:'.95rem',color:'var(--text2)',marginBottom:6}}>Vin non reconnu</h4>
            <p style={{fontSize:'.78rem',color:'var(--text3)',lineHeight:1.5}}>L'étiquette n'a pas pu être associée à un vin de votre cave.</p>
            <div style={{display:'flex',gap:9,marginTop:16,justifyContent:'center'}}>
              <button className="btn btn-ghost btn-sm" onClick={reset}>↺ Réessayer</button>
              <button className="btn btn-ghost btn-sm" onClick={onCancel}>Annuler</button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

/* ─── DASHBOARD ─── */
function Dashboard({wines,tastings,onUpdateWine,onSante,onOpenScan}) {
  const total = wines.reduce((a,w)=>a+w.qty,0);
  const totalVal = wines.reduce((a,w)=>a+w.qty*w.price,0);
  const byR = ['Bordeaux','Bourgogne','Rhône','Loire','Champagne','Provence','Alsace','Languedoc','Étranger']
    .map(r=>({r,c:wines.filter(w=>w.region===r).reduce((a,w)=>a+w.qty,0)}))
    .filter(x=>x.c>0);
  const maxR = Math.max(...byR.map(x=>x.c),1);
  const hist = [
    ...wines.flatMap(w=>w.history.map(h=>({...h,wine:w.name}))),
    ...tastings.map(t=>({type:'sante',wine:t.wineName,qty:t.qty,date:t.date,note:t.companions?'avec '+t.companions:''}))
  ].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);
  const top = [...wines].sort((a,b)=>b.qty-a.qty).slice(0,5);
  const quickOut = w => {
    if(w.qty<=0) return;
    const h={type:'out',qty:1,date:new Date().toISOString().split('T')[0],note:'Sortie rapide'};
    onUpdateWine({...w,qty:w.qty-1,history:[...w.history,h]});
  };
  return (
    <div>
      <div className="kpi-grid">
        {[
          {l:'Bouteilles',v:total,s:`${wines.length} références`,i:'🍾'},
          {l:'Valeur estimée',v:`${totalVal.toLocaleString('fr-FR')} €`,s:"Prix d'achat",i:'💰'},
          {l:'Dégustations',v:tastings.length,s:'dans le journal',i:'🌿'},
          {l:'Millésime moy.',v:wines.length?Math.round(wines.reduce((a,w)=>a+w.vintage,0)/wines.length):'—',s:'Tous vins',i:'📅'},
        ].map(({l,v,s,i})=>(
          <div className="kpi-card" key={l}>
            <div className="kpi-lbl">{l}</div>
            <div className="kpi-val">{v}</div>
            <div className="kpi-sub">{s}</div>
            <div className="kpi-icon">{i}</div>
          </div>
        ))}
      </div>

      <div className="scan-banner" onClick={onOpenScan}>
        <div className="sb-ico">📷</div>
        <div className="sb-txt">
          <div className="sb-title">Scanner une étiquette pour sortir</div>
          <div className="sb-sub">Photo → identification → sortie ou Santé !</div>
        </div>
        <div className="sb-arr">›</div>
      </div>

      <div className="dash-grid">
        <div className="dash-card">
          <h3>🍾 Sortie rapide</h3>
          <div className="qe-list">
            {top.map(w=>(
              <div className="qe-item" key={w.id}>
                <div className={`qe-dot ${COLOR_DOT[w.color]}`}/>
                <div className="qe-info">
                  <div className="qe-name">{w.name}</div>
                  <div className="qe-meta">{w.vintage} · {w.region}</div>
                </div>
                <div className="qe-qty">{w.qty}</div>
                <button className="qe-btn qe-sante" onClick={()=>onSante(w)} disabled={w.qty===0} title="Santé !">🌿</button>
                <button className="qe-btn" onClick={()=>quickOut(w)} disabled={w.qty===0} title="−1">−</button>
              </div>
            ))}
            {top.length===0&&<div style={{fontSize:'.82rem',color:'var(--text3)',textAlign:'center',padding:'14px'}}>Aucun vin en cave</div>}
          </div>
        </div>

        <div className="dash-card">
          <h3>🗺 Par région</h3>
          <div className="region-bar">
            {byR.map(({r,c})=>(
              <div className="region-row" key={r}>
                <div className="region-name">{r}</div>
                <div className="bar-track"><div className="bar-fill" style={{width:`${(c/maxR)*100}%`}}/></div>
                <div className="region-ct">{c}</div>
              </div>
            ))}
            {byR.length===0&&<div style={{fontSize:'.78rem',color:'var(--text3)'}}>Ajoutez vos premiers vins</div>}
          </div>
        </div>

        <div className="dash-card" style={{gridColumn:'1/-1'}}>
          <h3>📋 Activité récente</h3>
          <div className="act-list">
            {hist.map((h,i)=>(
              <div className="act-item" key={i}>
                <div className={`act-badge ${h.type==='in'?'b-in':h.type==='sante'?'b-sante':'b-out'}`}>
                  {h.type==='in'?'↓':h.type==='sante'?'🌿':'↑'}
                </div>
                <div className="act-name">{h.wine} × {h.qty}{h.note?` — ${h.note}`:''}</div>
                <div className="act-date">{h.date}</div>
              </div>
            ))}
            {hist.length===0&&<div style={{fontSize:'.8rem',color:'var(--text3)'}}>Aucune activité récente</div>}
          </div>
        </div>
      </div>
    </div>
  );
}

                  <div className="tc-meta">

/* ─── WINE DETAIL ─── */
function WineDetail({wine,onClose,onUpdate,onDelete,onSante}) {
  const [notes,setNotes] = useState(wine.notes);
  const [qty,setQty] = useState(wine.qty);
  const [rating,setRating] = useState(wine.rating);
  const [mn,setMn] = useState('');

  const handleQtyChange = delta => {
    const nq = Math.max(0,qty+delta);
    const h = {type:delta>0?'in':'out',qty:Math.abs(delta),date:new Date().toISOString().split('T')[0],note:mn};
    setQty(nq); setMn('');
    onUpdate({...wine,qty:nq,notes,rating,history:[...wine.history,h]});
  };

  const ot = wine.origineType
    ? `${ORIGINE_LABEL[wine.origineType]||wine.origineType}${wine.origineDetail?' · '+wine.origineDetail:''}`
    : '—';
  const df = wine.dateAchat
    ? new Date(wine.dateAchat).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'})
    : null;

  return (
    <div className="overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="detail-panel">
        <div className="dp-header">
          <div className="dp-header-bg"/>
          <button className="dp-close" onClick={onClose}>✕</button>
          <div className="dp-header-c">
            <div className={`color-tag ${COLOR_TAG[wine.color]||'tag-red'}`}>● {COLOR_LABEL[wine.color]}</div>
            <div className="dp-name">{wine.name}</div>
            <div className="dp-vintage">{wine.appellation} · {wine.vintage}</div>
          </div>
        </div>
        <div className="dp-body">
          <div style={{marginBottom:18}}>
            <button className="btn btn-sante" style={{width:'100%',justifyContent:'center',fontSize:'1rem'}}
              disabled={qty===0} onClick={()=>{onSante(wine);onClose();}}>
              🌿 Santé ! — Ouvrir cette bouteille
            </button>
            {qty===0&&<p style={{fontSize:'.7rem',color:'var(--text3)',textAlign:'center',marginTop:5}}>Plus de bouteilles en cave</p>}
          </div>

          <div className="dp-sec">
            <div className="dp-sec-title">Informations</div>
            <div className="info-grid">
              <div className="ii"><div className="ii-lbl">Région</div><div className="ii-val">{wine.region}</div></div>
              <div className="ii"><div className="ii-lbl">Producteur</div><div className="ii-val">{wine.producer||'—'}</div></div>
              <div className="ii"><div className="ii-lbl">Cépages</div><div className="ii-val">{wine.grapes||'—'}</div></div>
              <div className="ii"><div className="ii-lbl">Prix d'achat</div><div className="ii-val">{wine.price?`${wine.price} €`:'—'}</div></div>
              {df&&<div className="ii"><div className="ii-lbl">📅 Enregistré le</div><div className="ii-val">{df}</div></div>}
              <div className="ii full"><div className="ii-lbl">Origine</div><div className="ii-val">{ot}</div></div>
            </div>
          </div>

          <div className="dp-sec">
            <div className="dp-sec-title">Gestion du stock</div>
            <div className="qty-ctrl">
              <button className="qty-btn" onClick={()=>handleQtyChange(-1)}>−</button>
              <div className="qty-disp">{qty}</div>
              <button className="qty-btn" onClick={()=>handleQtyChange(1)}>+</button>
              <span style={{fontSize:'.72rem',color:'var(--text3)'}}>bouteilles</span>
            </div>
            <input className="fi" style={{marginTop:9}} placeholder="Note de mouvement…" value={mn} onChange={e=>setMn(e.target.value)}/>
          </div>

          <div className="dp-sec">
            <div className="dp-sec-title">Ma note</div>
            <Stars rating={rating} onRate={r=>{setRating(r);onUpdate({...wine,qty,notes,rating:r});}}/>
          </div>

          <div className="dp-sec">
            <div className="dp-sec-title">Notes de dégustation</div>
            <textarea className="notes-area" placeholder="Arômes, structure, accords, potentiel de garde…" value={notes} onChange={e=>setNotes(e.target.value)}/>
            <button className="btn btn-ghost btn-sm" style={{marginTop:8}} onClick={()=>onUpdate({...wine,qty,notes,rating})}>Sauvegarder</button>
          </div>

          <div className="dp-sec">
            <div className="dp-sec-title">Historique</div>
            <div className="hist-list">
              {[...wine.history].reverse().map((h,i)=>(
                <div className="hist-item" key={i}>
                  <div className={`hist-dot ${h.type}`}/>
                  <div className="hist-c">
                    <div className="hist-action">
                      {h.type==='in'?'Entrée':h.type==='sante'?'🌿 Dégustation':'Sortie'} {h.qty} btl
                      {h.note&&<span style={{color:'var(--text3)',fontStyle:'italic'}}> — {h.note}</span>}
                    </div>
                    <div className="hist-date">{h.date}</div>
                  </div>
                </div>
              ))}
            </div>
          </div>

          <div style={{marginTop:20,paddingTop:13,borderTop:'1px solid var(--border)'}}>
            <button className="btn btn-danger btn-sm" onClick={()=>{onDelete(wine.id);onClose();}}>🗑 Supprimer ce vin</button>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ─── CAVE VIEW ─── */
function CaveView({wines,onSelect,onOpenScan}) {
  const [search,setSearch] = useState('');
  const [fc,setFc] = useState('all');
  const [fr,setFr] = useState('all');
  const [vm,setVm] = useState('grid');
  const filtered = wines.filter(w=>{
    const q = search.toLowerCase();
    const ms = !q
      ||w.name.toLowerCase().includes(q)
      ||w.appellation.toLowerCase().includes(q)
      ||w.producer.toLowerCase().includes(q)
      ||String(w.vintage).includes(q)
      ||(w.origineDetail||'').toLowerCase().includes(q);
    return ms&&(fc==='all'||w.color===fc)&&(fr==='all'||w.region===fr);
  });
  const regions = [...new Set(wines.map(w=>w.region))];
  return (
    <div>
      <div className="list-controls">
        <div className="search-box">
          <span style={{color:'var(--text3)'}}>🔍</span>
          <input placeholder="Vin, appellation, producteur…" value={search} onChange={e=>setSearch(e.target.value)}/>
        </div>
        <select className="fsel" value={fc} onChange={e=>setFc(e.target.value)}>
          <option value="all">Couleurs</option>
          <option value="red">Rouge</option>
          <option value="white">Blanc</option>
          <option value="rose">Rosé</option>
          <option value="sparkling">Pétillant</option>
        </select>
        <select className="fsel" value={fr} onChange={e=>setFr(e.target.value)}>
          <option value="all">Régions</option>
          {regions.map(r=><option key={r} value={r}>{r}</option>)}
        </select>
        <div className="view-toggle">
          <button className={`vbtn ${vm==='grid'?'active':''}`} onClick={()=>setVm('grid')}>⊞</button>
          <button className={`vbtn ${vm==='table'?'active':''}`} onClick={()=>setVm('table')}>☰</button>
        </div>
      </div>

      <div className="scan-banner" onClick={onOpenScan} style={{marginBottom:14}}>
        <div className="sb-ico">📷</div>
        <div className="sb-txt">
          <div className="sb-title">Scanner pour sortir une bouteille</div>
          <div className="sb-sub">Reconnaissance d'étiquette instantanée</div>
        </div>
        <div className="sb-arr">›</div>
      </div>

      {filtered.length===0&&(
        <div className="empty-state">
          <div className="empty-ico">🍷</div>
          <h3>Aucun vin trouvé</h3>
          <p style={{fontSize:'.8rem',marginTop:4}}>Modifiez vos filtres ou ajoutez un vin.</p>
        </div>
      )}

      {vm==='grid'&&filtered.length>0&&(
        <div className="wine-grid">
          {filtered.map(w=>(
            <div className="wine-card" key={w.id} onClick={()=>onSelect(w)}>
              <div className="wc-img">
                {w.img?<img src={w.img} alt={w.name}/>:<span className="wc-ico">🍷</span>}
                <div className={`wc-dot ${COLOR_DOT[w.color]}`}/>
              </div>
              <div className="wc-body">
                <div className="wc-name">{w.name}</div>
                <div className="wc-meta">{w.appellation} · {w.vintage}</div>
                {w.origineType&&<div className="wc-meta">{ORIGINE_LABEL[w.origineType]}{w.origineDetail&&` · ${w.origineDetail}`}</div>}
                <div className="wc-foot">
                  <div><div className="wc-qty">{w.qty}</div><div className="wc-qty-l">bouteilles</div></div>
                  <div className="stars">{[1,2,3,4,5].map(i=><span key={i} className={`star ${w.rating>=i?'on':''}`}>★</span>)}</div>
                </div>
              </div>
            </div>
          ))}
        </div>
      )}

      {vm==='table'&&filtered.length>0&&(
        <div className="dash-card" style={{padding:0,overflowX:'auto'}}>
          <table className="wine-table">
            <thead>
              <tr><th>Nom</th><th>Région</th><th>Mill.</th><th>Origine</th><th>Qté</th><th>★</th></tr>
            </thead>
            <tbody>
              {filtered.map(w=>(
                <tr key={w.id} onClick={()=>onSelect(w)}>
                  <td>{w.name}</td>
                  <td>{w.region}</td>
                  <td>{w.vintage}</td>
                  <td>{w.origineType?`${ORIGINE_LABEL[w.origineType]}${w.origineDetail?' · '+w.origineDetail:''}` :'—'}</td>
                  <td style={{color:'var(--gold)',fontWeight:600}}>{w.qty}</td>
                  <td>{'★'.repeat(w.rating)}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

/* ─── ADD FORM ─── */
function AddWineForm({onAdd,onCancel}) {
  const today = new Date().toISOString().split('T')[0];
  const [scanning,setScanning] = useState(false);
  const [scanned,setScanned] = useState(false);
  const [imgFile,setImgFile] = useState(null);
  const [imgSrc,setImgSrc] = useState(null);
  const [form,setForm] = useState({
    name:'',appellation:'',vintage:new Date().getFullYear(),
    color:'red',region:'Bordeaux',producer:'',grapes:'',
    price:'',qty:1,origineType:'caviste',origineDetail:'',dateAchat:today,notes:''
  });
  const set = (k,v) => setForm(f=>({...f,[k]:v}));

  const simulateScan = () => {
    setScanning(true);
    setTimeout(()=>{
      setScanning(false);setScanned(true);
      setForm(f=>({...f,name:'Gevrey-Chambertin VV',appellation:'Gevrey-Chambertin',
        vintage:2019,color:'red',region:'Bourgogne',producer:'Rossignol-Trapet',grapes:'Pinot Noir',price:'42'}));
    },1800);
  };

  const handleFile = e => {
    const f = e.target.files?.[0]; if(!f) return;
    setImgFile(f);
    const r = new FileReader();
    r.onload = ev => setImgSrc(ev.target.result);
    r.readAsDataURL(f);
  };

  const handleSubmit = () => {
    if(!form.name.trim()) return;
    onAdd({
      ...form,
      vintage:parseInt(form.vintage)||new Date().getFullYear(),
      price:parseFloat(form.price)||0,
      qty:parseInt(form.qty)||1,
      imgFile, imgSrc,
      history:[{type:'in',qty:parseInt(form.qty)||1,date:form.dateAchat||today,note:'Ajout initial'}],
    });
  };

  const origPlaceholder = {caviste:'Nom du caviste…',viticulteur:'Nom du domaine…',cadeau:'Offert par…',autre:'Précisions…'};

  return (
    <div className="form-wrap">
      <div className="form-panel">
        <div className="form-title">🍾 Enregistrer un nouveau vin</div>

        <div className="ff full" style={{marginBottom:13}}>
          <div className="fl">Photo de l'étiquette</div>
          <div className="pzone">
            <input type="file" accept="image/*" capture="environment" onChange={handleFile}/>
            {imgSrc?<img src={imgSrc} alt="" className="pzone-preview"/>:<><div className="pzone-ico">📷</div><div className="pzone-lbl">Photographier ou importer</div></>}
          </div>
          <div style={{marginTop:7,display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
            <span className={`scan-badge ${scanning?'scanning':''}`} onClick={!scanning?simulateScan:undefined}>
              {scanning?'✨ Analyse…':scanned?'✓ Reconnue':'✨ Reconnaître l\'étiquette'}
            </span>
            {imgFile&&<span style={{fontSize:'.67rem',color:'#6abf8e'}}>📷 Photo prête à l'envoi</span>}
          </div>
        </div>

        <div className="fg">
          <div className="ff full"><label className="fl">Nom du vin *</label><input className="fi" value={form.name} onChange={e=>set('name',e.target.value)} placeholder="ex. Château Margaux"/></div>
          <div className="ff"><label className="fl">Appellation</label><input className="fi" value={form.appellation} onChange={e=>set('appellation',e.target.value)} placeholder="ex. Margaux"/></div>
          <div className="ff"><label className="fl">Millésime</label><input className="fi" type="number" value={form.vintage} onChange={e=>set('vintage',e.target.value)} min="1900" max="2030"/></div>
          <div className="ff">
            <label className="fl">Couleur</label>
            <select className="fsel2" value={form.color} onChange={e=>set('color',e.target.value)}>
              <option value="red">Rouge</option><option value="white">Blanc</option><option value="rose">Rosé</option><option value="sparkling">Pétillant</option>
            </select>
          </div>
          <div className="ff">
            <label className="fl">Région</label>
            <select className="fsel2" value={form.region} onChange={e=>set('region',e.target.value)}>
              {REGIONS.map(r=><option key={r} value={r}>{r}</option>)}
            </select>
          </div>
          <div className="ff"><label className="fl">Producteur</label><input className="fi" value={form.producer} onChange={e=>set('producer',e.target.value)} placeholder="Domaine / Château"/></div>
          <div className="ff"><label className="fl">Cépages</label><input className="fi" value={form.grapes} onChange={e=>set('grapes',e.target.value)} placeholder="ex. Pinot Noir"/></div>
          <div className="ff"><label className="fl">Prix (€)</label><input className="fi" type="number" value={form.price} onChange={e=>set('price',e.target.value)} placeholder="0"/></div>
          <div className="ff"><label className="fl">Quantité</label><input className="fi" type="number" value={form.qty} onChange={e=>set('qty',e.target.value)} min="1"/></div>
          <div className="ff full">
            <label className="fl">📅 Date d'enregistrement en cave</label>
            <input type="date" className="fi" value={form.dateAchat} onChange={e=>set('dateAchat',e.target.value)} style={{colorScheme:'dark'}}/>
          </div>
          <div className="ff full">
            <label className="fl">Origine</label>
            <div className="origine-btns">
              {Object.entries(ORIGINE_LABEL).map(([k,l])=>(
                <button key={k} className={`ob ${form.origineType===k?'sel':''}`} onClick={()=>set('origineType',k)}>{l}</button>
              ))}
            </div>
            <input className="fi" value={form.origineDetail} onChange={e=>set('origineDetail',e.target.value)} placeholder={origPlaceholder[form.origineType]}/>
          </div>
          <div className="ff full">
            <label className="fl">Notes</label>
            <textarea className="notes-area" value={form.notes} onChange={e=>set('notes',e.target.value)} placeholder="Premières impressions…"/>
          </div>
        </div>

        <div className="form-actions">
          <button className="btn btn-ghost" onClick={onCancel}>Annuler</button>
          <button className="btn btn-gold" onClick={handleSubmit}>Enregistrer</button>
        </div>
      </div>
    </div>
  );
}

/* ─── APP ─── */
function App() {
  const [wines,setWines]       = useState(()=>localGet('cb_wines',[]));
  const [tastings,setTastings] = useState(()=>localGet('cb_tastings',[]));
  const [loading,setLoading]   = useState(true);
  const [sync,setSync]         = useState('syncing');
  const [view,setView]         = useState('dashboard');
  const [selected,setSelected] = useState(null);
  const [santeWine,setSante]   = useState(null);
  const [showScan,setShowScan] = useState(false);
  const [toast,setToast]       = useState(null);

  const showToast = (msg,icon='✓') => setToast({msg,icon,key:Date.now()});

  /* LOAD FROM SUPABASE */
  useEffect(()=>{
    (async()=>{
      try {
        setSync('syncing');
        const [wRes,tRes] = await Promise.all([
          db.from('wines').select('*').order('created_at',{ascending:true}),
          db.from('tastings').select('*').order('created_at',{ascending:true}),
        ]);
        if(wRes.error) throw wRes.error;
        if(tRes.error) throw tRes.error;
        const wl = (wRes.data||[]).map(dbToWine);
        const tl = (tRes.data||[]).map(dbToTasting);
        setWines(wl); localSet('cb_wines',wl);
        setTastings(tl); localSet('cb_tastings',tl);
        setSync('online');
      } catch(e) {
        console.warn('Supabase offline, using local cache:', e.message);
        setSync('offline');
      }
      setLoading(false);
    })();
  },[]);

  /* SYNC WINE */
  const syncWine = async w => {
    try { await db.from('wines').upsert(wineToDb(w),{onConflict:'id'}); setSync('online'); }
    catch { setSync('offline'); }
  };

  /* ADD WINE */
  const addWine = async wineData => {
    const id = uid();
    let imgUrl = null;

    if(wineData.imgFile) {
      try {
        setSync('syncing');
        imgUrl = await uploadPhoto(wineData.imgFile, id);
        showToast('Photo enregistrée dans Supabase','📷');
      } catch(e) {
        imgUrl = wineData.imgSrc||null;
        showToast('Photo en local (hors ligne)','💾');
      }
    } else {
      imgUrl = wineData.imgSrc||null;
    }

    const {imgFile:_f,imgSrc:_s,...rest} = wineData;
    const wine = {...rest, id, img:imgUrl, rating:0};
    const newWines = [...wines, wine];
    setWines(newWines); localSet('cb_wines',newWines);
    setView('cave');
    showToast(`« ${wine.name} » ajouté !`,'✓');
    db.from('wines').insert(wineToDb(wine))
      .then(()=>setSync('online'))
      .catch(()=>setSync('offline'));
  };

  /* UPDATE WINE */
  const updateWine = w => {
    const updated = wines.map(x=>x.id===w.id?w:x);
    setWines(updated); localSet('cb_wines',updated);
    syncWine(w);
  };

  /* DELETE WINE */
  const deleteWine = async id => {
    const wine = wines.find(w=>w.id===id);
    const updated = wines.filter(w=>w.id!==id);
    setWines(updated); localSet('cb_wines',updated);
    showToast('Vin supprimé','🗑');
    try {
      await db.from('wines').delete().eq('id',String(id));
      if(wine?.img && wine.img.includes('/labels/')) {
        const path = decodeURIComponent(wine.img.split('/labels/')[1]?.split('?')[0]||'');
        if(path) await db.storage.from('labels').remove([path]);
      }
      setSync('online');
    } catch { setSync('offline'); }
  };

  /* SANTÉ */
  const handleSanteConfirm = form => {
    const h = {type:'sante',qty:1,date:form.date,note:form.companions?'avec '+form.companions:''};
    updateWine({...santeWine,qty:Math.max(0,santeWine.qty-1),history:[...santeWine.history,h]});
    const tasting = {
      id:uid(), wineId:santeWine.id, wineName:santeWine.name,
      wineAppellation:santeWine.appellation, wineVintage:santeWine.vintage,
      wineColor:santeWine.color, date:form.date, companions:form.companions,
      rating:form.rating, notes:form.notes, qty:1,
    };
    const newTastings = [...tastings,tasting];
    setTastings(newTastings); localSet('cb_tastings',newTastings);
    db.from('tastings').insert(tastingToDb(tasting)).then(()=>setSync('online')).catch(()=>setSync('offline'));
    setSante(null);
    showToast('Dégustation enregistrée 🌿','✓');
    setView('tastings');
  };

  /* DELETE TASTING */
  const deleteTasting = id => {
    const updated = tastings.filter(t=>t.id!==id);
    setTastings(updated); localSet('cb_tastings',updated);
    db.from('tastings').delete().eq('id',String(id)).then(()=>setSync('online')).catch(()=>{});
  };

  /* SCAN OUT */
  const handleScanOut = wine => {
    const h = {type:'out',qty:1,date:new Date().toISOString().split('T')[0],note:'Sortie par scan'};
    updateWine({...wine,qty:Math.max(0,wine.qty-1),history:[...wine.history,h]});
    setShowScan(false);
    showToast(`${wine.name} — 1 btl sortie`,'🍾');
  };

  const titles = {
    dashboard: <><em>Tableau</em> de bord</>,
    cave:      <><em>Ma</em> Cave</>,
    tastings:  <><em>Journal</em> de dégustation</>,
    add:       <><em>Ajouter</em> un vin</>,
  };

  if(loading) return (
    <>
      <style>{CSS}</style>
      <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',minHeight:'100dvh',gap:16,background:'var(--bg)'}}>
        <style>{'@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}'}</style>
        <div style={{fontSize:'3rem',animation:'pulse 1.5s infinite'}}>🍷</div>
        <div style={{fontFamily:"'Playfair Display',serif",fontSize:'1.3rem',color:'var(--gold)',letterSpacing:'.08em'}}>CaveBook</div>
        <div style={{fontSize:'.75rem',color:'var(--text3)'}}>Connexion à la cave…</div>
      </div>
    </>
  );

  return (
    <>
      <style>{CSS}</style>
      <div className="app">
        <Sidebar view={view} setView={setView} wines={wines} tastings={tastings} sync={sync}/>
        <div className="main">
          <div className="topbar">
            <div className="topbar-l">
              <div className="topbar-title">{titles[view]}</div>
              <SyncDot state={sync}/>
            </div>
            <div className="topbar-a">
              <button className="btn btn-ghost btn-sm" onClick={()=>setShowScan(true)} title="Scanner une étiquette">📷</button>
              {view!=='add'&&<button className="btn btn-gold btn-sm" onClick={()=>setView('add')}>+ Ajouter</button>}
            </div>
          </div>
          <div className="content">
            {view==='dashboard'&&(
              <Dashboard wines={wines} tastings={tastings}
                onUpdateWine={updateWine} onSante={w=>setSante(w)} onOpenScan={()=>setShowScan(true)}/>
            )}
            {view==='cave'&&(
              <CaveView wines={wines} onSelect={w=>setSelected(w)} onOpenScan={()=>setShowScan(true)}/>
            )}
            {view==='tastings'&&<TastingsView tastings={tastings} onDelete={deleteTasting}/>}
            {view==='add'&&<AddWineForm onAdd={addWine} onCancel={()=>setView('cave')}/>}
          </div>
        </div>
        <BottomNav view={view} setView={setView}/>
      </div>

      {selected&&(
        <WineDetail
          wine={wines.find(w=>w.id===selected.id)||selected}
          onClose={()=>setSelected(null)}
          onUpdate={w=>{updateWine(w);setSelected(w);}}
          onDelete={id=>{deleteWine(id);setSelected(null);}}
          onSante={w=>{setSelected(null);setSante(w);}}
        />
      )}
      {showScan&&(
        <ScanExitModal wines={wines}
          onSimpleOut={handleScanOut}
          onSante={w=>{setShowScan(false);setSante(w);}}
          onCancel={()=>setShowScan(false)}/>
      )}
      {santeWine&&(
        <SanteModal wine={santeWine} onConfirm={handleSanteConfirm} onCancel={()=>setSante(null)}/>
      )}
      {toast&&<Toast key={toast.key} msg={toast.msg} icon={toast.icon} onDone={()=>setToast(null)}/>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
